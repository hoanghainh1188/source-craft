# Cấu hình đóng gói SourceCraft (v0.1 pre-release). CHƯA code-sign/notarize/auto-update (pha sau — cần
# Apple Developer ID + Windows cert). Native module (@lancedb/lancedb, keytar) dùng prebuilt N-API
# (ABI ổn định qua Node/Electron) → npmRebuild:false, chỉ unpack .node khỏi asar.
appId: com.insightvault.app
productName: SourceCraft
copyright: © 2026 hoanghainh1188

# N-API prebuilt → KHÔNG rebuild (tránh cần Rust/toolchain build lại @lancedb trên CI).
npmRebuild: false

directories:
  output: release
  buildResources: build

# Đưa icon.png vào resources để main set được BrowserWindow/dock icon lúc chạy (ngoài .icns/.ico của bundle).
extraResources:
  - from: build/icon.png
    to: icon.png
  # Phân phối: kèm giấy phép của app + thông báo bên thứ ba (MIT/BSD/Apache/LGPL/GPL yêu cầu giữ nguyên văn bản).
  # FFmpeg LGPL tối giản (scripts/build-ffmpeg-lgpl.sh) — chạy riêng bằng spawn, kèm giấy phép + cấu hình dựng.
  - from: build/ffmpeg
    to: ffmpeg
  - from: LICENSE
    to: LICENSE.txt
  - from: THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md

# electron-vite xuất ra out/; production deps trong node_modules tự được gộp theo `dependencies`.
files:
  - out/**/*
  - package.json
  # 078 slim-bundle: LOẠI dep LỒNG của @lancedb — bản riêng onnxruntime-node (180M) + onnxruntime-web
  # (94M, WASM trình duyệt) + @huggingface (38M) DÀNH CHO embedding-function nội bộ của lancedb mà app
  # KHÔNG dùng (app tự embed qua @huggingface/transformers TOP-LEVEL rồi đưa vector vào). Đã verify lancedb
  # dist KHÔNG require eager chúng (chỉ lazy `eval(import())` khi gọi embedding-function). ~312M.
  - "!node_modules/@lancedb/lancedb/node_modules/onnxruntime-node/**"
  - "!node_modules/@lancedb/lancedb/node_modules/onnxruntime-web/**"
  - "!node_modules/@lancedb/lancedb/node_modules/@huggingface/**"
  # 096 slim-bundle: bản *.wasm.js của tesseract.js-core là WASM nhúng base64 DÀNH CHO TRÌNH DUYỆT; ở Node, core
  # `tesseract-core-*.js` đọc file `.wasm` cạnh nó (đã verify bằng chạy thật). ~25,7M. GIỮ cả họ LSTM + không-LSTM:
  # tesseract.js 7 (adapter Node) thực tế nạp bản KHÔNG-LSTM — giữ cả hai để nâng cấp sửa lỗi đó không làm hỏng OCR.
  # Test canh giữ: tests/unit/slim-tesseract.test.ts.
  - "!node_modules/tesseract.js-core/*.wasm.js"
  # Giấy phép: decoder AAC/WMA của @audio/decode là GPL, app KHÔNG dùng (chỉ wav/mp3/flac/ogg; nạp lazy theo đuôi) ⇒ LOẠI
  # khỏi bản cài để không phân phối mã GPL. Test canh giữ: tests/unit/license-exclusions.test.ts.
  - "!node_modules/@audio/decode-aac/**"
  - "!node_modules/@audio/decode-wma/**"

# Binary native phải nằm NGOÀI asar để load được lúc chạy.
asarUnpack:
  - "**/*.node"
  - node_modules/@lancedb/**
  - node_modules/keytar/**
  # 053: WASM core + worker của tesseract.js (OCR ảnh) phải ngoài asar mới load được.
  - node_modules/tesseract.js/**
  - node_modules/tesseract.js-core/**

mac:
  target:
    - dmg
  category: public.app-category.productivity
  icon: build/icon.icns
  # v0.1: KHÔNG ký (unsigned) — người dùng mở lần đầu qua chuột phải → Open.
  identity: null
  artifactName: ${productName}-${version}-${arch}.${ext}
  # 186: Ghi cuộc họp — macOS hiện câu này trong hộp xin quyền micro (bắt buộc từ Mojave, kể cả bản chưa ký).
  extendInfo:
    NSMicrophoneUsageDescription: "SourceCraft records meetings you start, and processes the audio on this computer."
  # 186: sẵn sàng cho lúc bật ký/hardened runtime (pha sau) — vô hại khi identity: null.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # 078: bản mac chỉ cần binary onnxruntime-node cho darwin → LOẠI win32+linux (~176M). Merge với `files` chung.
  files:
    - "!node_modules/onnxruntime-node/bin/napi-v6/win32/**"
    - "!node_modules/onnxruntime-node/bin/napi-v6/linux/**"

dmg:
  writeUpdateInfo: false

win:
  target:
    - nsis
  # electron-builder tự sinh .ico từ PNG 1024 khi build (không cần ImageMagick trên runner).
  icon: build/icon.png
  artifactName: ${productName}-${version}-Setup.${ext}
  # 078: bản win chỉ cần binary onnxruntime-node cho win32 → LOẠI darwin+linux (~87M). Merge với `files` chung.
  files:
    - "!node_modules/onnxruntime-node/bin/napi-v6/darwin/**"
    - "!node_modules/onnxruntime-node/bin/napi-v6/linux/**"

nsis:
  # 145: bộ cài đa ngôn ngữ — tiếng Việt trên Windows tiếng Việt, còn lại English (tự chọn theo ngôn ngữ hệ điều hành).
  multiLanguageInstaller: true
  installerLanguages:
    - en_US
    - vi_VN
  displayLanguageSelector: false
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
