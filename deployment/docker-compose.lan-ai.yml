services:
  # Option 1: vLLM OpenAI-compatible engine with NVIDIA GPU acceleration
  vllm-engine:
    image: vllm/vllm-openai:latest
    container_name: sourcecraft-vllm
    restart: unless-stopped
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    volumes:
      - ./models:/root/.cache/huggingface
    ipc: host
    command: >
      --model Qwen/Qwen2.5-14B-Instruct
      --tensor-parallel-size 1
      --gpu-memory-utilization 0.90
      --max-model-len 8192
      --port 8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - lan-ai-net

  # Reverse proxy for Bearer token validation and TLS/HTTP access
  lan-ai-proxy:
    image: nginx:alpine
    container_name: sourcecraft-lan-ai-proxy
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx-lan-ai.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - vllm-engine
    networks:
      - lan-ai-net

networks:
  lan-ai-net:
    driver: bridge
