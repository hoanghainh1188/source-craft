# Nginx Reverse Proxy for SourceCraft LAN AI Server
# Validates Bearer Token before forwarding to backend LLM engine (Ollama or vLLM).

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Map authorization header to validate shared enterprise secret token
    map $http_authorization $is_authorized {
        default 0;
        # Change this token to your organization internal secret token
        "Bearer sourcecraft-enterprise-secret-key-2026" 1;
    }

    server {
        listen 80;
        server_name localhost ai.corp.internal;

        # Healthcheck endpoint open for ping without token
        location /healthz {
            return 200 '{"status":"ok","service":"lan-ai-proxy"}';
            add_header Content-Type application/json;
        }

        # Protected AI routing
        location / {
            if ($is_authorized = 0) {
                return 401 '{"error":{"message":"Unauthorized: Invalid or missing LAN AI Bearer token","type":"auth_error"}}';
            }

            # Forward to vLLM (OpenAI-compatible) or Ollama
            proxy_pass http://vllm-engine:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Enable streaming SSE responses for LLM generation
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
        }
    }
}
