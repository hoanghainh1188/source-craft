name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Cổng chất lượng THẬT cho app (khác pipeline-config-check chỉ kiểm cấu hình pipeline/docs).
  # Đặt job này ("build-test") làm required status check trong Ruleset của main.
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Cài dependencies (từ lockfile)
        run: npm ci

      # 248: src/main/pro/ của repo public PHẢI là stub MIT — chặn lọt mã repo private source-craft-pro (dấu SPDX
      # LicenseRef-SourceCraft-Pro) và phụ thuộc Pro chưa khai ở package.json.
      - name: Kiểm stub src/main/pro (không chứa mã Pro)
        run: node scripts/pro-overlay.mjs check-stub

      - name: Lint (prettier --check + eslint + tsc)
        run: npm run lint

      - name: Unit test + coverage (≥ 80% business logic — Constitution IV)
        run: npm test

      # Không build ở đây: `npm run build` chạy lại lint, và job e2e đã tự `electron-vite build` → lỗi build
      # vẫn bị chặn. Đóng gói (electron-builder) chỉ chạy ở release.yml khi đẩy tag v*.

  # E2E (Playwright _electron) cần display → xvfb trên Linux. Suite tất định: IV_EMBED_FAKE=1 (không tải
  # model) + UNREACHABLE_OLLAMA (không cần Ollama thật) → chỉ kiểm bề mặt IPC + đường "chưa sẵn sàng".
  # Job riêng (không phụ thuộc build-test); là required check của main (từ 2026-10-06).
  # Bình thường ~3 phút; timeout để job treo (vd apt mirror lỗi lúc GitHub sự cố) báo lỗi sớm thay vì chờ 6 giờ.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Cài dependencies (từ lockfile)
        run: npm ci

      - name: "Build out/ (electron-vite — e2e chạy trên out/main)"
        run: npx electron-vite build

      - name: Cài thư viện hệ thống + xvfb cho Electron headless
        timeout-minutes: 10
        # Chỉ deps của Chromium (Electron dùng chung) + GTK/NSS/ALSA cho Electron + xvfb — KHÔNG cài deps của
        # mọi trình duyệt (~126 MB font/gstreamer/codec) để ít phụ thuộc tốc độ mirror apt.
        run: |
          npx playwright install-deps chromium
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0t64 libnss3 libasound2t64

      - name: E2E (Playwright _electron qua xvfb)
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" npm run test:e2e
