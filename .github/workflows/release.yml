name: release

# Đóng gói + phát hành khi đẩy tag v* (VD v0.1.0). Mỗi nền tảng build trên runner của chính nó — BẮT BUỘC
# vì native module (@lancedb/lancedb, keytar) có binary theo nền tảng, KHÔNG cross-build được.
# v0.1: unsigned (chưa code-sign/notarize). macOS runner = Apple Silicon → dmg arm64.
#
# 248 — mô hình stub như Sheafly (docs/pro-repo-split-plan.md §4.2): job `pro` dùng deploy key CHỈ-ĐỌC
# SOURCECRAFT_PRO_DEPLOY_KEY lấy repo private source-craft-pro, kiểm khớp stub và chốt MỘT commit cho mọi nền tảng;
# job build chép đè src/main/pro/ bằng đúng commit đó rồi build.
#   - Đẩy tag v* (event push) thiếu key ⇒ FAIL (không bao giờ phát hành nhầm bản thiếu Pro).
#   - Chạy tay (workflow_dispatch) / fork thiếu key ⇒ cảnh báo, build bằng stub.
#   - Chạy tay CHỈ để kiểm build: KHÔNG upload bộ cài, KHÔNG tạo/ghi đè GitHub Release (kể cả khi chọn chạy từ một tag)
#     — artifact của repo public ai cũng tải được, không để lộ bản Pro chưa phát hành (pro_ref tuỳ ý).
#   - Mã Pro không bao giờ thành artifact; mọi checkout repo Pro dùng persist-credentials: false và nằm SAU npm ci
#     (lifecycle script của gói npm không chạm được SSH key). Log repo public là public ⇒ khi có bản Pro, lỗi
#     tsc/test/build chỉ báo tóm tắt (có thể in mã Pro) — chi tiết xem CI repo source-craft-pro / CI public (stub).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      pro_ref:
        description: "Branch / tag / SHA của repo source-craft-pro (mặc định master)"
        required: false
        default: master

permissions:
  contents: read

jobs:
  pro:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Kiểm deploy key repo Pro
        id: key
        env:
          KEY: ${{ secrets.SOURCECRAFT_PRO_DEPLOY_KEY }}
          IS_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ -n "$KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=false" >> "$GITHUB_OUTPUT"
          if [ "$IS_TAG" = "true" ]; then
            echo "::error::Tag phát hành $GITHUB_REF_NAME thiếu secret SOURCECRAFT_PRO_DEPLOY_KEY — không phát hành bản thiếu Pro."
            exit 1
          fi
          echo "::warning::Thiếu SOURCECRAFT_PRO_DEPLOY_KEY (chạy tay / fork) — build bằng stub, KHÔNG có chức năng Pro."
          echo "### Bản build: stub (không có chức năng Pro)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: steps.key.outputs.present == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Cài dependencies (từ lockfile)
        if: steps.key.outputs.present == 'true'
        run: npm ci

      - name: Lấy repo Pro
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: hoanghainh1188/source-craft-pro
          ref: ${{ inputs.pro_ref || 'master' }}
          ssh-key: ${{ secrets.SOURCECRAFT_PRO_DEPLOY_KEY }}
          persist-credentials: false
          path: .pro

      - name: Kiểm khớp stub (api-types.test.ts + deps.json) và chốt commit
        id: pin
        if: steps.key.outputs.present == 'true'
        run: |
          node .pro/scripts/check-stub.mjs --public .
          sha="$(git -C .pro rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "### Bản build: Pro @ \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

      # Chép đè thử + tsc + test của bản Pro một lần trước khi build đa nền tảng. Ẩn chi tiết lỗi (có thể chứa mã Pro).
      - name: Kiểm bản Pro trên mã public (chép đè, tsc, test)
        if: steps.key.outputs.present == 'true'
        run: |
          node scripts/pro-overlay.mjs apply .pro
          npx tsc --noEmit --pretty false -p tsconfig.node.json > /dev/null 2>&1 \
            || { echo "::error::tsc thất bại với bản Pro — xem CI repo source-craft-pro."; exit 1; }
          npx vitest run src/main/pro > /dev/null 2>&1 \
            || { echo "::error::Test bản Pro thất bại — xem CI repo source-craft-pro."; exit 1; }

  build:
    needs: pro
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cài MSYS2 (toolchain MinGW cho FFmpeg)
        if: matrix.platform == 'win'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: false
          install: >-
            make diffutils curl xz mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Cài dependencies (từ lockfile)
        run: npm ci

      # FFmpeg LGPL tối giản (thay ffmpeg-static GPL/nonfree) — dựng từ mã nguồn đã ghim sha256. Windows: MSYS2/MinGW.
      - name: Dựng FFmpeg LGPL (mac)
        if: matrix.platform == 'mac'
        run: npm run ffmpeg:build

      - name: Dựng FFmpeg LGPL (win)
        if: matrix.platform == 'win'
        shell: msys2 {0}
        run: bash scripts/build-ffmpeg-lgpl.sh

      # 248: đúng commit job `pro` đã chốt (mọi nền tảng cùng một bản Pro).
      - name: Lấy repo Pro (commit đã chốt)
        if: needs.pro.outputs.sha != ''
        uses: actions/checkout@v4
        with:
          repository: hoanghainh1188/source-craft-pro
          ref: ${{ needs.pro.outputs.sha }}
          ssh-key: ${{ secrets.SOURCECRAFT_PRO_DEPLOY_KEY }}
          persist-credentials: false
          path: .pro

      # pro-overlay.mjs chỉ chép src/ + tests/ + 2 tệp ghim (không bao giờ .git/.github), kiểm dấu
      # LicenseRef-SourceCraft-Pro trên mọi tệp mã; sau đó xoá hẳn .pro kèm .git/.github của nó.
      - name: Chép đè src/main/pro/ bằng bản Pro
        if: needs.pro.outputs.sha != ''
        shell: bash
        run: |
          node scripts/pro-overlay.mjs apply .pro
          rm -rf .pro
          grep -q "LicenseRef-SourceCraft-Pro" src/main/pro/index.ts

      - name: Build bằng stub (không có chức năng Pro)
        if: needs.pro.outputs.sha == ''
        shell: bash
        run: echo "::warning::Không có bản Pro — bộ cài này dùng stub src/main/pro/."

      - name: Build + đóng gói (electron-vite + electron-builder)
        shell: bash
        env:
          # Bỏ qua ký macOS (v0.1 unsigned) — không tự dò chứng chỉ trên runner.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          PLATFORM: ${{ matrix.platform }}
          PRO_SHA: ${{ needs.pro.outputs.sha }}
        run: |
          if [ -z "$PRO_SHA" ]; then
            npm run "dist:$PLATFORM"
            echo "### $PLATFORM: build bằng stub" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Có bản Pro: ẩn output (lỗi bundle có thể in code frame mã Pro ra log public).
          npm run "dist:$PLATFORM" > build.log 2>&1 \
            || { echo "::error::Build với bản Pro thất bại — log bị ẩn để không lộ mã Pro; tái hiện bằng CI repo source-craft-pro hoặc build local."; exit 1; }
          echo "### $PLATFORM: build bằng bản Pro @ \`$PRO_SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        # Chỉ khi phát hành (đẩy tag) — chạy tay không upload bộ cài.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error

  release:
    needs: build
    # Chỉ phát hành khi ĐẨY tag v* — chạy tay (workflow_dispatch), kể cả chọn chạy từ tag, chỉ build.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tải artifact từ các job build
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Tạo GitHub pre-release + đính kèm dmg/exe
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          prerelease: false
          name: SourceCraft ${{ github.ref_name }} (pre-release)
          files: artifacts/**/*
          fail_on_unmatched_files: true
          body: |
            ## SourceCraft ${{ github.ref_name }} — bản tiền phát hành

            Trợ lý tri thức **cục bộ (local-first)** kiểu NotebookLM chạy offline — hỏi đáp tài liệu với
            trích dẫn kiểm chứng được, tổng hợp Studio, AI local (Ollama) hoặc online (Claude/Gemini/OpenAI
            bằng API key riêng).

            ### Tải về
            - **macOS (Apple Silicon):** `SourceCraft-*-arm64.dmg`
            - **Windows (x64):** `SourceCraft-*-Setup.exe`

            ### Lưu ý (bản tiền phát hành)
            - **Chưa code-sign/notarize** → lần đầu mở sẽ có cảnh báo hệ điều hành:
              - macOS: chuột phải vào app → **Open** (hoặc Cài đặt → Privacy & Security → Open Anyway).
              - Windows: SmartScreen → **More info** → **Run anyway**.
            - **Chưa hỗ trợ tự cập nhật** — tải bản mới thủ công từ Releases.
            - macOS Intel (x64) chưa được đóng gói ở bản này.
            - Cần **Ollama** chạy cục bộ để dùng AI local; hoặc nhập API key để dùng AI online.
